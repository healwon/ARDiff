# Runs ARDiff on what a push changed (EQUIVALENT / NOT EQUIVALENT + semantic difference):
#   all mode (default, also on push): oldV/newV folders under PAIRS_ROOT (examples/readable-vs-fast) -> oldV vs newV
#     (every folder by default; limit N = N folders spread over the list)
#   pairs mode: only folders touched by the commit(s)
#   methods mode: each changed method, old commit vs new commit
# and publishes to GitHub Pages: index.html = Software Regression Visualization (unified_report.py),
# report.html = per-method report, viewers/ = refinement viewers.
name: ARDiff commit check

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Git URL of the repo to check. Empty = this repo"
        required: false
        default: ""
      commit:
        description: "Commit to check against its parent (default HEAD). Ignored when range is set"
        required: false
        default: ""
      range:
        description: "BASE..HEAD range instead of a single commit (e.g. main..feature)"
        required: false
        default: ""
      mode:
        description: "all = every oldV/newV folder under pairs_root; pairs = only folders touched by the commit(s); methods = changed methods across commits"
        type: choice
        options: [all, pairs, methods]
        default: all
      pairs_root:
        description: "all mode: folder to scan for oldV/newV pairs (e.g. benchmarks)"
        required: false
        default: "examples/readable-vs-fast"
      limit:
        description: "all mode: how many folders to check, evenly spread (0 = all)"
        required: false
        default: "0"
      only:
        description: "Regex to limit what is checked (folder path in pairs mode, Class.method(sig) in methods mode)"
        required: false
        default: ""
  push:
    branches: [main, master, docs]
    paths:
      - "**.java"
      - "refinement/**"
      - ".github/workflows/refinement-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true      # a full run takes long: a newer push replaces the running one

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340          # "all" runs ~140 pairs
    env:
      JOBS: "2"
      HEAP: "4G"          # 2 jobs x (4G ARDiff + 3G JPF child) stays under the runner's 16 GB
      JPF_HEAP: "3g"
      TIMEOUT: ${{ (inputs.mode || 'all') == 'all' && '300' || '600' }}   # per pair, seconds
      TARGET_REPO: ${{ inputs.target_repo }}
      COMMIT: ${{ inputs.commit }}
      RANGE: ${{ inputs.range }}
      ONLY: ${{ inputs.only }}
      MODE: ${{ inputs.mode || 'all' }}          # push: all mode too
      LIMIT: ${{ inputs.limit || '0' }}           # push: every pair under PAIRS_ROOT
      PAIRS_ROOT: ${{ inputs.pairs_root || 'examples/readable-vs-fast' }}
      EVENT: ${{ github.event_name }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_AFTER: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # commit check needs history

      - name: Set up Zulu JDK 8 with JavaFX
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"
          java-package: jdk+fx

      - name: Install difftastic (structural diff for the report)
        continue-on-error: true      # the report falls back to a line diff without it
        run: |
          curl -fsSL https://github.com/Wilfred/difftastic/releases/download/0.71.0/difft-0.71.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "DIFFT=$RUNNER_TEMP/difft" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/difft" --version | head -1

      - name: Use all runner cores
        run: echo "CORES=0-$(( $(nproc) - 1 ))" >> "$GITHUB_ENV"

      - name: Setup ARDiff
        run: |
          chmod +x Implementation/z3 refinement/*.sh refinement/commitcheck/*.py
          ARDIFF_JAVA_HOME="$JAVA_HOME" refinement/ardiff-workflow.sh setup

      - name: Choose what to check
        run: |
          repo="$GITHUB_WORKSPACE"
          if [ -n "$TARGET_REPO" ]; then
            git clone --quiet "$TARGET_REPO" "$RUNNER_TEMP/target"
            repo="$RUNNER_TEMP/target"
          fi
          if [ -n "$RANGE" ]; then
            sel="--range $RANGE"
          elif [ -n "$COMMIT" ]; then
            sel="--commit $COMMIT"
          elif [ "$EVENT" = push ] && [ -z "$TARGET_REPO" ] \
               && [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] \
               && git -C "$repo" cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            sel="--range $PUSH_BEFORE..$PUSH_AFTER"     # everything in this push
          else
            sel="--commit HEAD"
          fi
          echo "CHECK_REPO=$repo" >> "$GITHUB_ENV"
          echo "CHECK_SEL=$sel" >> "$GITHUB_ENV"
          echo "checking: ${TARGET_REPO:-this repo} $sel"

      - name: Run commit check
        run: |
          args=(--repo "$CHECK_REPO" --out "$RUNNER_TEMP/report")
          case "$MODE" in
            pairs) args+=(--pairs) ;;
            all)   args+=(--all-pairs "$PAIRS_ROOT" --limit "$LIMIT") ;;
          esac
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          # CHECK_SEL is "--range X" or "--commit X": word-split on purpose
          set +e
          refinement/ardiff-workflow.sh commit $CHECK_SEL "${args[@]}"
          rc=$?
          set -e
          # 2 = at least one NOT EQUIVALENT method: a valid result, not a failure
          [ $rc -eq 0 ] || [ $rc -eq 2 ] || exit $rc
          cat "$RUNNER_TEMP/report/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble site
        run: |
          r="$RUNNER_TEMP/report"
          mkdir -p _site
          cp "$r/report.html" "$r/report.md" "$r/report.json" _site/
          [ -d "$r/viewers" ] && cp -r "$r/viewers" _site/
          # main page: Software Regression Visualization over every pair ARDiff ran (old report stays at report.html)
          dirs=()
          for d in "$r"/pairs/*/; do [ -f "$d/debug.log" ] && dirs+=("${d%/}"); done
          if [ ${#dirs[@]} -gt 0 ]; then
            python3 refinement/commitcheck/unified_report.py _site/index.html "${dirs[@]}"
          else
            cp "$r/report.html" _site/index.html
          fi
          # live playground (edit code in the browser; "Run ARDiff on GitHub" goes through ardiff-issue.yml)
          python3 refinement/playground/build_playground.py _site/playground.html --report "$r/report.json" --repo "$GITHUB_REPOSITORY"
          # ARDiff inputs and logs per method, for anyone who wants the raw data
          if [ -d "$r/pairs" ]; then
            mkdir -p _site/pairs
            (cd "$r/pairs" && find . \( -name 'oldV.java' -o -name 'newV.java' -o -name 'debug.log' -o -name 'meta.json' \
               -o -name 'z3summary.txt' -o -name '*ToSolve.txt' -o -name '*JPFError.txt' -o -name '*JPFOutput.txt' -o -name 'I*VARDiff.java' \) \
               -not -path '*/instrumented/*' -size -6M -exec cp --parents {} "$GITHUB_WORKSPACE/_site/pairs/" \;)
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
